name: Production release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Same lock as CI/development; held while production awaits approval.
  group: shared-delivery-${{ github.repository }}
  cancel-in-progress: false
jobs:
  production:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      packages: write
      actions: read
      pull-requests: read
    uses: taskovskig/platform-tools/.github/workflows/production.yaml@v0.8.0
    secrets: inherit
