image: sample-api:dev
port: 8080
healthPath: /hello
env:
  - {name: DB_HOST, value: db}
  - {name: DB_PORT, value: "5432"}
  - name: DB_NAME
    valueFrom:
      secretKeyRef:
        name: database
        key: POSTGRES_DB
  - name: DB_USER
    valueFrom:
      secretKeyRef:
        name: database
        key: POSTGRES_USER
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: database
        key: POSTGRES_PASSWORD
